name: Unsigned IPA

# Every push is a commit landing on the repository, including non-main branches.
# Each one produces its own unsigned IPA artifact.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/reusable-unsigned.yml
    with:
      build_number: ${{ format('{0}.{1}', github.run_id, github.run_attempt) }}
