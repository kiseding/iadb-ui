name: Unsigned IPA

# The only workflow that builds an IPA. Branch pushes upload an artifact.
# A vMAJOR.MINOR.PATCH tag uses the same build and publishes the GitHub release.
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-ipa
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Read version
        id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "is_release=false" >> "$GITHUB_OUTPUT"
          echo "marketing_version=" >> "$GITHUB_OUTPUT"
          if [[ "$REF" == refs/tags/* ]]; then
            if [[ ! "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Release tags must use vMAJOR.MINOR.PATCH, got $REF_NAME"
              exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "marketing_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/reusable-unsigned.yml
    with:
      marketing_version: ${{ needs.prepare.outputs.marketing_version }}
      build_number: ${{ format('{0}.{1}', github.run_id, github.run_attempt) }}

  github-release:
    needs: [prepare, build]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          pattern: iADB-unsigned-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: iADB ${{ needs.prepare.outputs.marketing_version }}
          files: release-assets/*.ipa
          generate_release_notes: true
