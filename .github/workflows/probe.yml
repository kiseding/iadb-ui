name: Runner probe

# Temporary: reports which macOS images actually hand out a runner right now.
# A job that never gets a runner sits queued with an empty runner_name and is
# cancelled after fifteen minutes, which is indistinguishable from a build
# failure unless the allocations are measured separately.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Report
        run: |
          echo "allocated on ${{ matrix.os }}"
          sw_vers || true
          xcodebuild -version || true
