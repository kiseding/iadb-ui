name: Release

# Signed TestFlight upload only. The unsigned IPA is built by Unsigned IPA,
# including when this tag is pushed.
on:
  push:
    tags: ['v*']

concurrency:
  group: app-store-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      marketing_version: ${{ steps.version.outputs.marketing_version }}
    steps:
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH, got $RELEASE_TAG"
            exit 1
          fi
          echo "marketing_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  testflight:
    needs: prepare
    uses: ./.github/workflows/reusable-testflight.yml
    with:
      marketing_version: ${{ needs.prepare.outputs.marketing_version }}
      build_number: ${{ format('{0}.{1}', github.run_id, github.run_attempt) }}
      apple_team_id: ${{ vars.APPLE_TEAM_ID }}
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      SIGNING_REPO_SSH_KEY: ${{ secrets.SIGNING_REPO_SSH_KEY }}
