name: Verify build

# Compiles the app and the test bundle, then runs the tests, all in Debug for a
# simulator. The Release archive is a separate concern with its own workflow and
# takes about seventeen minutes; this exists to answer two questions quickly:
# does everything still compile, and do the tests pass?
#
# Two runner images are requested at once because macOS capacity is allocated
# unevenly: a job can sit queued with no runner for fifteen minutes and then be
# cancelled without ever producing a step. Whichever image gets a runner first
# finishes the check, and fail-fast is off so a queue timeout on one does not
# take the other with it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode project
        uses: ./.github/actions/setup-xcode

      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Select simulator
        id: simulator
        run: |
          DESTINATION=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [
              device
              for runtime, runtime_devices in devices.items()
              if "iOS" in runtime
              for device in runtime_devices
              if device.get("isAvailable") and "iPhone" in device["name"]
          ]
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          print("platform=iOS Simulator,id=" + candidates[-1]["udid"])
          ')
          echo "destination=$DESTINATION" >> "$GITHUB_OUTPUT"

      # Compiles the app target and the test bundle. This is the step that
      # catches type errors in iADBTests, which the device build never sees.
      - name: Build app and tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project iADB.xcodeproj \
            -scheme iADB \
            -configuration Debug \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/compile.log

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project iADB.xcodeproj \
            -scheme iADB \
            -configuration Debug \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            2>&1 | tee build/test.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-diagnostics-${{ matrix.os }}
          path: |
            build/*.log
            build/TestResults.xcresult
          retention-days: 7
